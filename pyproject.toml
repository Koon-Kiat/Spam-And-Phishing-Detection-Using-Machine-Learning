[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-and-phishing-detection"
version = "1.0.0"
description = "Leakage-safe spam and phishing email training and inference workflow"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4==4.15.0",
  "datasketch==2.0.0",
  "Flask==3.1.3",
  "joblib==1.6.0",
  "matplotlib==3.11.1",
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "tldextract==5.3.2"
]

[project.optional-dependencies]
transformer = [
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "torch==2.14.0",
  "transformers==5.17.0"
]
dev = [
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.7"
]

[project.scripts]
spam-phishing = "spamandphishingdetection.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: full-data or transformer tests"
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
  ".cache",
  ".tools",
  ".venv",
  "artifacts",
  "reports"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
